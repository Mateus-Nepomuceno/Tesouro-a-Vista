<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesouro a vista</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="desenv.js" defer></script>
</head>
<body>
    <div class="gamelimit">

        <!-- Título -->
        <p class="opcoestxt">Opções</p>

        <!-- Camada transparente para iluminação -->
        <div class="overlay"></div>

        <!-- Controles de interação -->
        <div class="controles">

            <!-- Controle de música -->
            <div class="msc">
                <a>Música</a>
                <img id="imagemmusica" class="musicaIcon" src="imagensgame/msc 1.png" alt="Música ligada">
                <img id="imagemmusicad" class="musicaIcon2" src="imagensgame/msc2.png" alt="Música desligada">
            </div>

            <!-- Controle de som -->
            <div class="sm">
                <a>Som</a>
                <img id="imagemsom" class="somIcon" src="imagensgame/som 1.png" alt="Som ligado">
                <img id="imagemsomd" class="somIcon2" src="imagensgame/som 2.png" alt="Som desligado">
            </div>

            <!-- Controle de iluminação -->
            <div class="bri">
                <label class="ilu" for="brilho">Iluminação</label>
                <input type="range" id="brilho" min="0" max="100" value="50">
            </div>  

        </div>

        <!-- Botão de voltar -->
        <a class="voltaropcoes" href="estrutura.html">Voltar ao menu inicial</a>

    </div>
</body>
</html>
