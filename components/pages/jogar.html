<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Mapas</title>
    <link rel="stylesheet" href="../styles/jogar.css">
    <script src="../scripts/tabuleiro.js" defer></script>
</head>

<body class="conteudo">
    <header class="conteudo_cabecalho">
        <h1>Escolha o Mapa</h1>
    </header>
    <main class="conteudo_mapas">
        <audio id="musicaSelecao" src="../../game_assets/index/tesouro à vista!.mp3" loop preload="auto"></audio>
        <audio id="somClique" src="../../game_assets/tabuleiro/clique.mp3" preload="auto"></audio>
        <div class="conteudo_mapas_ilha">
            <h2 class="conteudo_mapas_ordem_texto">Ilha do Tesouro</h2>
            <a class="conteudo_mapas_ordem_imagem" href="../pages/tabuleiro.html" id="ilhaComSom">
                <img class="conteudo_mapas_ordem_imagem_ilha" src="../../game_assets/jogar/Ilha.webp">
            </a>
        </div>
        <div class="conteudo_mapas_caverna">
            <h2 class="conteudo_mapas_ordem_texto">Caverna</h2>
            <div class="conteudo_mapas_ordem_imagem" href="#">
                <img class="conteudo_mapas_ordem_imagem_caverna" src="../../game_assets/jogar/caverna.webp">
            </div>
        </div>
        <div class="conteudo_mapas_deserto">
            <h2 class="conteudo_mapas_ordem_texto">Deserto</h2>
            <div class="conteudo_mapas_ordem_imagem" href="#">
                <img class="conteudo_mapas_ordem_imagem_deserto" src="../../game_assets/jogar/deserto.webp">
            </div>
        </div>
    </main>
    <footer>
        <div class="conteudo_rodape">
            <a href="../../index.html" id="VoltarilhaComSom">
                <div class="conteudo_rodape_imagem">
                    <img src="../../game_assets/PlacaMaior.webp">
                    <div class="conteudo_rodape_imagem_texto">
                        <p>Voltar ao Menu</p>
                    </div>
                </div>
            </a>
        </div>
    </footer>
</body>

</html>
