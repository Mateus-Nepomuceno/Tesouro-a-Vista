<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesouro à Vista</title>
    <link rel="stylesheet" href="components/styles/index.css">
    <link rel="stylesheet" href="components/styles/creditos.css">
    <link rel="stylesheet" href="components/styles/jogar.css">
    <link rel="stylesheet" href="components/styles/opcoes.css">
    <link rel="preload" href="../../game_assets/jogar/caverna.webp" as="image">
    <link rel="preload" href="../../game_assets/jogar/Ilha.webp" as="image">
    <link rel="preload" href="../../game_assets/jogar/deserto.webp" as="image">
    <link rel="preload" href="../../game_assets/creditos/creditos.webp" as="image">
    <link rel="preload" href="../../game_assets/fundoescuro.webp" as="image">
    <script src="components/scripts/index.js" defer></script>
</head>

<body class="conteudo">
    <header class="conteudo_cabecalho">
        <img class="conteudo_cabecalho_logo" src="game_assets/index/logo.webp">
    </header>
    <main>
        <!-- Sons do jogo -->
        <audio src="game_assets/index/tesouro à vista!.mp3" id="musica_fundo" loop></audio>
        <audio id="som_clique" src="game_assets/tabuleiro/clique.mp3" preload="auto"></audio>

        <!-- Aba de mapas -->
        <div class="esconder" id="aba_mapas">
            <section class="jogar_conteudo">
                <section class="jogar_conteudo_cabecalho">
                    <h1>Escolha o Mapa</h1>
                </section>
                <section class="jogar_conteudo_mapas">
                    <div class="jogar_conteudo_mapas_ilha">
                        <h2 class="jogar_conteudo_mapas_ordem_texto">Ilha do Tesouro</h2>
                        <a class="jogar_conteudo_mapas_ordem_imagem" href="components/pages/tabuleiro.html">
                            <img class="jogar_conteudo_mapas_ordem_imagem_ilha" src="../../game_assets/jogar/Ilha.webp">
                        </a>
                    </div>
                    <div class="jogar_conteudo_mapas_caverna">
                        <h2 class="jogar_conteudo_mapas_ordem_texto">Caverna</h2>
                        <div class="jogar_conteudo_mapas_ordem_imagem" href="#">
                            <img class="jogar_conteudo_mapas_ordem_imagem_caverna"
                                src="../../game_assets/jogar/caverna.webp">
                        </div>
                    </div>
                    <div class="jogar_conteudo_mapas_deserto">
                        <h2 class="jogar_conteudo_mapas_ordem_texto">Deserto</h2>
                        <div class="jogar_conteudo_mapas_ordem_imagem" href="#">
                            <img class="jogar_conteudo_mapas_ordem_imagem_deserto"
                                src="../../game_assets/jogar/deserto.webp">
                        </div>
                    </div>
                </section>
                <section>
                    <div class="jogar_conteudo_rodape">
                        <button onclick="tocarSomClique(); fecharAba('aba_mapas')">
                            <div class="jogar_conteudo_rodape_imagem">
                                <img src="../../game_assets/PlacaMaior.webp">
                                <div class="jogar_conteudo_rodape_imagem_texto">
                                    <p>Voltar ao Menu</p>
                                </div>
                            </div>
                        </button>
                    </div>
                </section>
            </section>
        </div>

        <!-- Aba de opções -->
        <div class="esconder" id="aba_opcoes">
            <section class="opcoes_conteudo">
                <section class="opcoes_conteudo_espacamento">
                    <div class="opcoes_conteudo_espacamento_cabecalho">
                        <button onclick="tocarSomClique(); fecharAba('aba_opcoes')">
                            <div class="opcoes_conteudo_espacamento_cabecalho_imagem">
                                <img src="../../game_assets/opcoes/placa2.webp">
                                <div class="opcoes_conteudo_espacamento_cabecalho_imagem_texto">
                                    <p>Voltar</p>
                                </div>
                            </div>
                        </button>
                    </div>
                </section>
                <section class="opcoes_conteudo_cabecalho">
                    <h1>Opções</h1>
                </section>
                <div class="opcoes_conteudo_principal">
                    <ul class="opcoes_conteudo_principal_texto">
                        <li>
                            <span>Música</span>
                            <button onclick="tocarSomClique(); manipularMusica(this)"><img class="opcoes_conteudo_principal_texto_imagem"
                                    src="../../game_assets/opcoes/musica.webp"></button>
                        </li>
                        <li>
                            <span>Som</span>
                            <button onclick="manipularSomClique(this)"><img class="opcoes_conteudo_principal_texto_imagem"
                                    src="../../game_assets/opcoes/som.webp"></button>
                        </li>
                    </ul>
                </div>
            </section>
        </div>

        <!-- Aba de créditos -->
        <div class="esconder" id="aba_creditos">
            <section class="creditos_conteudo">
                <section class="creditos_conteudo_espacamento">
                    <div class="creditos_conteudo_espacamento_cabecalho">
                        <button onclick="tocarSomClique(); fecharAba('aba_creditos')">
                            <div class="creditos_conteudo_espacamento_cabecalho_imagem">
                                <img src="../../game_assets/creditos/placa2.webp">
                                <div class="creditos_conteudo_espacamento_cabecalho_imagem_texto">
                                    <p>Voltar</p>
                                </div>
                            </div>
                        </button>
                    </div>
                </section>
                <div class="creditos_conteudo_principal">
                    <ul class="creditos_conteudo_principal_texto">
                        <li>Marta Gisele Barreto - Gestor</li>
                        <li>Luiza Bittencourt - Designer</li>
                        <li>Nairana Almeida - Designer</li>
                        <li>Mateus Santos - Programador</li>
                        <li>Tiago Bispo - Programador</li>
                    </ul>
                </div>
            </section>
        </div>

        <!-- Opções de jogo -->
        <div class="conteudo_opcao">
            <button onclick="tocarSomClique(); mostrarAba('aba_mapas')">
                <div class="conteudo_opcao_imagem">
                    <img src="game_assets/index/placa.webp">
                    <div class="conteudo_opcao_imagem_texto">
                        <p>Jogar</p>
                    </div>
                </div>
            </button>
        </div>

        <div class="conteudo_opcao">
            <button onclick="tocarSomClique(); mostrarAba('aba_opcoes')">
                <div class="conteudo_opcao_imagem">
                    <img src="game_assets/index/placa2.webp">
                    <div class="conteudo_opcao_imagem_texto">
                        <p>Opções</p>
                    </div>
                </div>
            </button>
        </div>


        <div class="conteudo_opcao">
            <button onclick="tocarSomClique(); mostrarAba('aba_creditos')">
                <div class="conteudo_opcao_imagem">
                    <img src="game_assets/index/placa.webp">
                    <div class="conteudo_opcao_imagem_texto">
                        <p>Créditos</p>
                    </div>
                </div>
            </button>
        </div>
    </main>
</body>

</html>
